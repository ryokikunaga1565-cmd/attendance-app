<html lang="ja"><head>


<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">


<meta name="theme-color" content="#14523e"><title>出勤簿</title>


<link rel="apple-touch-icon" href="icon.png"><link rel="icon" href="icon.png"><link rel="manifest" href="manifest.json">


<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="出勤簿">


<style>


:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;color:#30383e;background:#f3f0e9}


*{box-sizing:border-box}body{margin:0;background:#f3f0e9}button,select,input{font-family:inherit}


.container{max-width:520px;margin:auto;min-height:100dvh;background:#faf8f3}


.hero{background:#e9e2d6;color:#2d3338;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;border-bottom:1px solid #ded5c6}


.topline{display:flex;align-items:center;justify-content:center;position:relative;min-height:55px}


.brand-title{display:flex;align-items:center;justify-content:center;gap:16px;width:100%;min-width:0}


.brand-logo{width:51px;height:51px;object-fit:contain;flex-shrink:0;background:transparent;border:0;border-radius:0;padding:0}


h1{font-size:27px;line-height:1.2;margin:0;font-weight:850;color:#30383e;white-space:nowrap}


.refresh{position:absolute;right:0;top:calc(100% + 2px);z-index:1;border:1px solid #d0c4b4;background:#f9f6ef;color:#4c4a44;border-radius:9px;padding:9px 11px;font-size:13px;font-weight:800;min-height:40px;cursor:pointer}


.today{margin:8px 0 0;min-height:27px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:clamp(14px,4vw,18px);color:#4d4034;font-weight:850;text-align:center;white-space:nowrap}.today::before{content:"今日";flex-shrink:0;color:#85715a;font-size:11px;font-weight:750}@media(max-width:370px){.today{margin-right:0;font-size:13px;gap:5px}.today::before{font-size:10px}}


.main{padding:12px 14px calc(12px + env(safe-area-inset-bottom))}


.employee-line{display:flex;align-items:center;gap:10px;margin-bottom:11px;padding:9px 12px;background:#f0ece5;border:1px solid #e0d9cf;border-radius:11px;min-height:43px}


.employee-label{font-size:12px;font-weight:800;color:#736b62;flex-shrink:0}


#employeeDisplay{flex:1;min-width:0}#employeeName{font-size:16px;font-weight:850;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}


#employee{flex:1;min-width:0}


.panel{background:white;border:1px solid #e4ded4;border-radius:14px;padding:14px 13px 15px;box-shadow:0 2px 8px #493c2710}


.section-title{font-size:13px;font-weight:850;color:#73695c;margin:0 0 9px}


label{display:block;font-size:14px;font-weight:850;margin:10px 0 5px}


select,input{width:100%;height:49px;padding:9px 12px;font-size:17px;font-weight:650;border:2px solid #d8d1c7;border-radius:10px;background:#fff;color:#30383e}


select:focus,input:focus{outline:2px solid #bd9e60;outline-offset:1px}


button{cursor:pointer}


#checkInButton{display:block;width:100%;min-height:64px;margin-top:12px;background:#f5c758;color:#292c30;border:0;border-bottom:4px solid #c99a2e;border-radius:13px;font-size:23px;font-weight:900;box-shadow:0 4px 10px #bd8c1625}


#checkInButton:disabled,#lateSubmitButton:disabled{opacity:.6;cursor:not-allowed}


#lateButton{display:block;width:100%;min-height:45px;margin-top:10px;background:#fff;border:1.5px solid #d6cbb9;border-radius:11px;color:#4e4942;font-size:14px;font-weight:800}


#lateForm,#batchForm{background:white;border:1px solid #e0d8cd;border-radius:12px;margin-top:9px;padding:11px 13px}


#batchSubmitButton{width:100%;min-height:49px;margin-top:12px;border:0;border-radius:10px;background:#77614b;color:white;font-size:16px;font-weight:850}


#batchButton{display:block;width:100%;min-height:45px;margin-top:10px;background:#fff;border:1.5px solid #d6cbb9;border-radius:11px;color:#4e4942;font-size:14px;font-weight:800}


.batch-actions{display:flex;gap:7px;margin:9px 0}.batch-actions button{flex:1;border:1px solid #d6cbb9;background:#faf8f3;border-radius:8px;padding:9px 2px;font-size:12px;font-weight:800}.batch-calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.batch-calendar .dayhead{text-align:center;font-size:12px;color:#756a5e;padding:5px 0}.batch-calendar button{border:1px solid #ded8ce;border-radius:8px;min-height:38px;background:#fff;color:#30383e;font-weight:700}.batch-calendar button.selected{background:#14523e;color:white;border-color:#14523e}.batch-calendar button:disabled{background:#efede8;color:#b6afa5;cursor:not-allowed}.batch-summary{font-size:13px;line-height:1.6;margin-top:9px;white-space:pre-wrap}.batch-calendar .blank{min-height:38px}.batch-calendar button.registered{background:#e0e0e0;color:#777;border-color:#ccc;opacity:1}.batch-calendar button.registered:disabled{background:#e0e0e0;color:#777;opacity:1}


#checkInButton:disabled{opacity:.55;cursor:not-allowed}


#lateSubmitButton{width:100%;min-height:48px;margin-top:11px;border:0;border-radius:10px;background:#77614b;color:#fff;font-size:16px;font-weight:850}


#message{font-size:14px;font-weight:800;text-align:center;border-radius:10px;line-height:1.5;margin-top:10px}


#message:not(:empty){padding:11px}


.settings{display:block;margin:10px auto 0;background:transparent;border:0;color:#85796c;font-size:12px;padding:8px 14px;text-decoration:underline;text-underline-offset:3px}


@media(min-width:600px){.container{min-height:0;margin:24px auto;border-radius:19px;overflow:hidden;box-shadow:0 12px 32px #493c271c}}


@media(max-width:370px){.brand-logo{width:44px;height:44px}.brand-title{gap:10px}h1{font-size:24px}.refresh{padding:7px;font-size:12px}}


@media(max-height:690px){.hero{padding-bottom:9px}.main{padding-top:9px}.panel{padding:10px 12px}.employee-line{margin-bottom:8px}#checkInButton{min-height:57px}select,input{height:45px}label{margin-top:7px}}



/* 前日入力・まとめて入力を横並びにする */

.input-mode-buttons{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;margin-top:12px}

#lateButton,#batchButton{width:100%;min-width:0;min-height:76px;margin-top:0;padding:10px 5px;font-size:clamp(15px,4.2vw,18px);line-height:1.35;white-space:pre-line;text-align:center;font-weight:850}

#lateButton:disabled,#batchButton:disabled{opacity:.55;cursor:not-allowed}

#historyButton {

  display: block;

  width: 100%;

  min-height: 45px;

  margin-top: 12px;

  background: #fff;

  border: 1.5px solid #d6cbb9;

  border-radius: 11px;

  color: #4e4942;

  font-size: 15px;

  font-weight: 800;

  cursor: pointer;

}


#historyForm {

  margin-top: 10px;

}


/* 曜日・祝日の色は、選択済み／登録済みでも維持する。 */
.batch-calendar button.saturday,.batch-calendar button.saturday:disabled{background:#e7f1ff;color:#285786}
.batch-calendar button.holiday,.batch-calendar button.holiday:disabled{background:#fde8e8;color:#994747}
.batch-calendar button.selected{border:2px solid #14523e;box-shadow:inset 0 0 0 1px #14523e}
.batch-calendar button.selected::after{content:" ✓"}
.batch-calendar button.registered{border-style:dashed}
.batch-calendar button.registered::after{content:"済";display:block;font-size:10px}
.batch-calendar button:disabled{opacity:.58}
.batch-calendar button.registered:disabled{opacity:.72}
.batch-calendar .dayhead.saturday{background:#e7f1ff;color:#285786;border-radius:5px}
.batch-calendar .dayhead.holiday{background:#fde8e8;color:#994747;border-radius:5px}
.batch-holiday-status{font-size:12px;color:#756a5e;margin:6px 0}


#lateSubmitButton,#batchSubmitButton{margin:0 0 12px}
#message:not(:empty){padding:16px;margin:12px 0;border:1px solid #c6dfce;text-align:left}
#message .result-title{font-size:19px;font-weight:850;margin-bottom:8px}
#message .result-detail{font-size:14px;font-weight:500;white-space:pre-line;overflow-wrap:anywhere}
#message .result-counts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:10px 0}
#message .result-count{background:#ffffffb3;border-radius:8px;padding:10px 4px;text-align:center;font-size:12px}
#message .result-count strong{display:block;font-size:24px}
#message .result-count.failure{color:#a12b2b}
/* 現場選択だけをコンパクトにする。 */
#site,#pastSite,#editSite,#editPastSite{height:44px;padding:6px 10px;font-size:16px;line-height:1.25}
#site option,#pastSite option,#editSite option,#editPastSite option{font-size:16px;line-height:1.2;padding:2px 8px}
#site optgroup,#pastSite optgroup,#editSite optgroup,#editPastSite optgroup{font-size:14px;line-height:1.2}
label[for="site"]{margin:7px 0 4px}
.past-sites{margin:4px 0 0;font-size:14px}
.past-sites summary{cursor:pointer;color:#52627a;padding:4px 0;line-height:1.3}
.past-sites select{margin-top:3px}
.past-sites .site-select-label{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

<main class="main">

  <!-- 端末登録画面（認証機能の準備中） -->

<div id="deviceRegistration" style="display:none; background:white; border:1px solid #ddd; border-radius:12px; padding:16px; margin-bottom:16px;">


  <h2>端末登録</h2>


  <p>

    このスマートフォンを出勤簿に登録します。<br>

    会社の承認後に利用できるようになります。

  </p>


 <button type="button" id="requestDeviceButton"
  style="display:block; width:100%; padding:18px 16px;
         background:#1769d2; color:white;
         font-size:18px; font-weight:bold;
         border:none; border-radius:12px;
         cursor:pointer; margin:16px 0;">
  端末登録を申請する
</button>


  <p id="deviceRegistrationStatus"></p>


</div>


<div class="employee-line"><span class="employee-label">登録者</span><div id="employeeDisplay" style="display:none"><div id="employeeName"></div></div><select id="employee" aria-label="登録者"><option value="">読み込み中...</option></select></div>


<section class="panel"><div class="section-title">本日の勤務内容</div><label for="workType">勤務区分</label><select id="workType"><option>通常勤務</option><option>夜勤</option></select><label for="site">現場名</label><select id="site"><option value="">読み込み中...</option></select>

<button id="checkInButton" type="button" onclick="checkIn()">✓ 出勤する</button>


<div class="input-mode-buttons">

async function requestDeviceRegistration() {

  const employee = employeeSelect.value;

  const deviceId = localStorage.getItem("attendanceDeviceId");

  const status = document.getElementById("deviceRegistrationStatus");

  const button = document.getElementById("requestDeviceButton");



  if (!employee) {

    alert("先に社員名を選択してください");

    return;

  }



  if (!deviceId) {

    alert("端末IDが見つかりません");

    return;

  }


  button.disabled = true;

  status.textContent = "申請中...";


  try {

    const response = await fetch(webAppUrl, {

      method: "POST",

      body: JSON.stringify({

        action: "requestDevice",

        employee: employee,

        deviceId: deviceId

      })

    });


    const result = await response.json();


    if (result.result === "success") {

      status.textContent = "申請しました。管理者の承認をお待ちください。";

    } else if (result.result === "alreadyRequested") {

      status.textContent = "この端末は登録済み、または申請中です。";

    } else {

      throw new Error(result.message || "申請に失敗しました");

    }

  } catch (error) {

    status.textContent = "申請できませんでした：" + error.message;

    button.disabled = false;

  }

}

let batchRegistered = new Set();

let batchRegisteredLoading = false;

let batchRequestVersion = 0;

let batchRegisteredKey = '';



async function loadBatchRegisteredDates() {

  if (document.getElementById('batchForm').style.display === 'none' || batchSending) return;

  const employee = employeeSelect.value;

  const workType = workTypeSelect.value;

  const month = document.getElementById('batchMonth').value;

  const version = ++batchRequestVersion;

  batchRegisteredReady = false;

  batchRegisteredLoading = true;

  batchUndoHistory.length=0;
  ++batchSelectionRequest;
  batchRegistered.clear();

  batchSelected.clear();

  batchRegisteredKey = '';

  renderBatchCalendar();

  if (!employee || !workType || !month) {

    batchRegisteredLoading = false;

    renderBatchCalendar();

    return;

  }

  try {

    const url = webAppUrl + '?action=getRegisteredDates&employee=' + encodeURIComponent(employee)

      + '&workType=' + encodeURIComponent(workType) + '&_=' + Date.now();

    const response = await fetch(url, {cache:'no-store'});

    if (!response.ok) throw new Error('HTTP ' + response.status);

    const result = await response.json();

    if (version !== batchRequestVersion) return;

    if (result.result !== 'success' || !Array.isArray(result.registeredDates)) {

      throw new Error('登録済み日付の取得結果が不正です。Apps Scriptの再デプロイを確認してください。');

    }

    batchRegistered = new Set(result.registeredDates);

    batchRegisteredKey = employee + '\n' + workType;

    batchRegisteredReady = true;

  } catch (error) {

    if (version !== batchRequestVersion) return;

    console.error('登録済み日付の取得に失敗', error);

    batchRegisteredReady = false;

  } finally {

    if (version === batchRequestVersion) {

      batchRegisteredLoading = false;

      renderBatchCalendar();

    }

  }

}

function localDayString(d) {



  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;



}



function batchToday() { return localDayString(new Date()); }



function batchPeriod(month) {



  if (!/^\d{4}-(0[1-9]|1[0-2])$/.test(month)) return null;



  const [year, mon] = month.split('-').map(Number);



  const start = new Date(year, mon - 2, 21);



  const end = new Date(year, mon - 1, 20);



  return { start, end, startString:localDayString(start), endString:localDayString(end) };



}



function currentBatchMonth() {



  const now = new Date();



  const closing = new Date(now.getFullYear(), now.getMonth() + (now.getDate() > 20 ? 1 : 0), 1);



  return localDayString(closing).slice(0,7);



}

function appendSiteChoice(select, site, groups) {
  const option = document.createElement("option");
  option.value = site.code;
  option.dataset.siteName = site.name;
  option.textContent = [site.name, site.code].filter(Boolean).join(" ／ ");
  const label = [site.company, site.type, site.type === "公共" ? site.category : ""].filter(Boolean).join(" ／ ");
  if (!label) { select.appendChild(option); return; }
  if (!groups.has(label)) {
    const group = document.createElement("optgroup");
    group.label = label; groups.set(label, group); select.appendChild(group);
  }
  groups.get(label).appendChild(option);
}

async function saveAttendanceEdit() {
  const employee = document.getElementById("employee").value;
  const site = document.getElementById("editSite").value;
  const workType = document.getElementById("editWorkType").value;
  const deviceId = localStorage.getItem("attendanceDeviceId");
  const button = document.getElementById("saveEditButton");

  if (!editingRecordId || !employee || !site || !workType || !deviceId) {
    alert("修正に必要な情報が不足しています");
    return;
  }

  if (!confirm("この内容で出勤記録を修正しますか？")) return;

  button.disabled = true;
  button.textContent = "保存中...";

  try {
    const response = await fetch(webAppUrl, {
      method: "POST",
      body: JSON.stringify({
        action: "editAttendance",
        recordId: editingRecordId,
        employee: employee,
        deviceId: deviceId,
        site: site,
        siteCode: site,
        workType: workType
      })
    });

    const result = await response.json();

    if (result.result !== "success") {
      throw new Error(result.message || "修正に失敗しました");

    alert("出勤記録を修正しました");
    document.getElementById("editForm").style.display = "none";
    editingRecordId = null;
    await loadHistory();

  } catch (error) {
    alert(error.message);
  } finally {
    button.disabled = false;
    button.textContent = "保存する";
  }
}

list.appendChild(table);

loadBatchRegisteredDates();

function renderBatchCalendar() {



  const month = document.getElementById('batchMonth').value;



  const calendar = document.getElementById('batchCalendar');



  calendar.replaceChildren();



  const period = batchPeriod(month);



  if (!period || month > currentBatchMonth()) {



    document.getElementById('batchSummary').textContent = '当日を含む締め期間までを選択してください';



    document.getElementById('batchSubmitButton').disabled = true;



    return;



  }



  const title=document.createElement('div');



  title.style.cssText='grid-column:1/-1;text-align:center;font-size:13px;font-weight:800;color:#73695c;padding:4px 0';



  title.textContent=`${period.start.getFullYear()}年${period.start.getMonth()+1}月21日 〜 ${period.end.getFullYear()}年${period.end.getMonth()+1}月20日`;



  calendar.appendChild(title);



  ['日','月','火','水','木','金','土'].forEach((name,index)=>{



    const el=document.createElement('div');el.className='dayhead'+(index===0?' holiday':index===6?' saturday':'');el.textContent=name;calendar.appendChild(el);



  });



  for(let i=0;i<period.start.getDay();i++) {



    const blank=document.createElement('div');blank.className='blank';calendar.appendChild(blank);



  }



  for(let d=new Date(period.start);d<=period.end;d.setDate(d.getDate()+1)) {



    const date=localDayString(d);



    const btn=document.createElement('button');btn.type='button';



    btn.textContent=d.getDate()===1?`${d.getMonth()+1}/1`:String(d.getDate());



    btn.title=date;



    const registered=batchRegistered.has(date);

    btn.disabled=date>batchToday() || batchSending || !batchRegisteredReady || registered;

    if (registered) { btn.title=date+' 登録済み（選択不可）'; btn.setAttribute('aria-label',date+' 登録済み'); }



    const holidayName=batchHolidayData && batchHolidayData.holidays[date];
    const dayClass=(d.getDay()===0 || holidayName)?'holiday':d.getDay()===6?'saturday':'';
    btn.className=[registered?'registered':(batchSelected.has(date)?'selected':''),dayClass].filter(Boolean).join(' ');
    if(holidayName) {
      btn.title=date+' '+holidayName+(registered?' 登録済み（選択不可）':'');
      btn.setAttribute('aria-label',btn.title);
    }



    btn.setAttribute('aria-pressed',batchSelected.has(date)?'true':'false');



    btn.onclick=()=>{++batchSelectionRequest;if(!batchRegisteredReady || registered)return;rememberBatchSelection();if(batchSelected.has(date))batchSelected.delete(date);else batchSelected.add(date);renderBatchCalendar();};



    calendar.appendChild(btn);



  }



  updateBatchSummary();



}



async function refreshBatchHolidayColors() {
  const status=document.getElementById('batchHolidayStatus');
  status.textContent='祝日を確認中…';
  try {
    await loadBatchHolidays();
    status.textContent='';
    renderBatchCalendar();
  } catch(error) {
    status.textContent='祝日を取得できませんでした。土日のみ色分けしています。閉じて開き直すと再取得します。';
  }
}
const batchUndoHistory = [];
function batchUndoKey() {
  return [employeeSelect.value,workTypeSelect.value,document.getElementById('batchMonth').value].join("|");
}
function rememberBatchSelection() {
  batchUndoHistory.push({key:batchUndoKey(),dates:[...batchSelected]});
  if(batchUndoHistory.length>20) batchUndoHistory.shift();
}
function undoBatchSelection() {
  ++batchSelectionRequest;
  if(batchSending || !batchRegisteredReady)return;
  const last=batchUndoHistory[batchUndoHistory.length-1];
  if(!last || last.key!==batchUndoKey())return;
  batchUndoHistory.pop();
  const period=batchPeriod(document.getElementById('batchMonth').value);
  if(!period)return;
  batchSelected.clear();
  last.dates.forEach(date=>{
    if(date>=period.startString && date<=period.endString &&
       date<=batchToday() && !batchRegistered.has(date))batchSelected.add(date);
  });
  renderBatchCalendar();
}
let batchHolidayData = null;
let batchSelectionRequest = 0;
async function loadBatchHolidays() {
  if(batchHolidayData) return batchHolidayData;
  const controller=new AbortController();
  const timeout=setTimeout(()=>controller.abort(),15000);
  try {
    const response=await fetch(webAppUrl+"?action=getHolidays",{signal:controller.signal});
    if(!response.ok) throw new Error("祝日取得エラー");
    const data=await response.json();
    if(data.result!=="success" || !data.holidays ||
       !Number.isInteger(data.firstYear) || !Number.isInteger(data.lastYear))
      throw new Error("祝日データを取得できません。社員用GASの更新・再デプロイを確認してください。");
    batchHolidayData=data;
    return data;
  } finally { clearTimeout(timeout); }
}
async function selectBatchDays(mode) {
  const request=++batchSelectionRequest;
  if(batchSending || !batchRegisteredReady)return;
  const month=document.getElementById('batchMonth').value;
  const period=batchPeriod(month);
  if(!period || month>currentBatchMonth())return;
  let holidays={};
  if(mode==='weekdays') {
    try {
      const data=await loadBatchHolidays();
      if(period.start.getFullYear()<data.firstYear || period.end.getFullYear()>data.lastYear)
        throw new Error("この年の祝日データは未取得です。日付を手動で選択してください。");
      holidays=data.holidays;
    } catch(error) {
      if(request===batchSelectionRequest) alert(error.name==="AbortError" ?
        "祝日の取得がタイムアウトしました。選択は変更していません。もう一度お試しください。" :
        error.message);
      return;
    }
  }
  if(request!==batchSelectionRequest || batchSending || !batchRegisteredReady ||
     month!==document.getElementById('batchMonth').value)return;
  rememberBatchSelection();
  for(let d=new Date(period.start);d<=period.end;d.setDate(d.getDate()+1)) {
    const date=localDayString(d);
    batchSelected.delete(date);
    if(date>batchToday() || batchRegistered.has(date))continue;
    const weekday=d.getDay();
    if(mode==='all'||(mode==='weekdays'&&weekday>=1&&weekday<=5&&!holidays[date])||
       (mode==='monSat'&&weekday>=1&&weekday<=6))batchSelected.add(date);
  }
  renderBatchCalendar();
}
function selectedBatchDates() {



  const period=batchPeriod(document.getElementById('batchMonth').value);



  if(!period)return [];



  return [...batchSelected].filter(d=>d>=period.startString&&d<=period.endString&&d<=batchToday()&&!batchRegistered.has(d)&&batchRegisteredReady).sort();



}



function updateBatchSummary() {
  const lastUndo=batchUndoHistory[batchUndoHistory.length-1];
  document.getElementById('batchUndoButton').disabled=batchSending || !batchRegisteredReady ||
    !lastUndo || lastUndo.key!==batchUndoKey();



  const selected=selectedBatchDates();



  document.getElementById('batchSummary').textContent=!batchRegisteredReady?(batchRegisteredLoading?'登録状況を確認中...':'登録状況を取得できません。Apps Scriptの再デプロイと通信を確認してください。'):selected.length?`${selected.length}日選択：${selected.map(d=>Number(d.slice(5,7))+'/'+Number(d.slice(-2))).join('、')}`:'日付を選択してください';



  document.getElementById('batchSubmitButton').disabled=!isDeviceApproved()||!selected.length||batchSending||!batchRegisteredReady;



}



document.getElementById('batchMonth').addEventListener('change',()=>{++batchSelectionRequest;batchSelected.clear();loadBatchRegisteredDates();});



async function submitBatchCheckIn() {
  if (!isDeviceApproved()) { alert("この端末は承認されていません"); return; }



  if(batchSending)return;



  const month=document.getElementById('batchMonth').value;



  const dates=selectedBatchDates();



  const employee=employeeSelect.value, workType=workTypeSelect.value, site=siteSelect.value;



  if(!employee||!site){alert('社員名と現場名を選択してください');return;}

  if(batchRegisteredKey !== employee+'\n'+workType){alert('登録状況を再確認してください');await loadBatchRegisteredDates();return;}



  if(!dates.length){alert('出勤日を選択してください');return;}



  if(!confirm(`${employee}\n${workType} / ${site}\n${dates.length}日分を登録します。\n${dates.join('、')}\nよろしいですか？`))return;



  batchUndoHistory.length=0;
  batchSending=true;



  const submit=document.getElementById('batchSubmitButton');



  const message=document.getElementById('message');



  const results=document.getElementById('batchSummary');



  const workTypeInput=document.getElementById('workType');



  const siteInput=document.getElementById('site');

  document.getElementById('batchMonth').disabled=true;



  document.querySelectorAll('.batch-actions button').forEach(b=>b.disabled=true);



  updateInputMode();renderBatchCalendar();



  let success=0, duplicate=0, failed=[];



  for(let i=0;i<dates.length;i++) {



    const date=dates[i];



    submit.textContent=`送信中... ${i+1}/${dates.length}`;



    results.textContent=`${i+1}/${dates.length}件目を送信中：${date}`;



    try {



      // 当日分は通常の出勤API、過去日は後日申請APIを利用



const payload={

  employee,

  workType,

  site,
  siteCode: site,

  deviceId: localStorage.getItem("attendanceDeviceId")

};

      if(date!==batchToday()){payload.workDate=date;payload.action='lateCheckIn';}



      const response=await fetch(webAppUrl,{method:'POST',body:JSON.stringify(payload)});



      if(!response.ok)throw new Error('HTTP '+response.status);



      const result=await response.json();



      if(result.result==='success'){success++;batchSelected.delete(date);}



      else if(result.result==='duplicate'){duplicate++;batchSelected.delete(date);}



      else {failed.push(date);}



    } catch(e){failed.push(date);console.error('一括入力失敗',date,e);}



  }



  batchSending=false;



  workTypeInput.disabled=false;siteInput.disabled=false;



  document.getElementById('batchMonth').disabled=false;



  document.querySelectorAll('.batch-actions button').forEach(b=>b.disabled=false);



  submit.textContent='選択した日をまとめて登録';



  renderBatchCalendar();updateInputMode();



  const report=`一括入力結果：登録成功 ${success}件／登録済み ${duplicate}件／失敗 ${failed.length}件`;



  results.textContent=report+(failed.length?`\n失敗日：${failed.join('、')}（選択を残しています）`:'');

if (failed.length === 0) {
  batchOpen = false;
  document.getElementById('batchForm').style.display = 'none';
  updateInputMode();
}



  attendanceResult(failed.length ? "一括入力：確認が必要です" : "✓ 一括入力が完了しました",
    employee+" ／ "+workType+"\n"+selectedSiteLabel()+
    (failed.length ? "\n失敗日："+failed.join("、")+"\n未確認の日付は選択を残しています。出勤履歴を確認してください。" : ""),
    [success,duplicate,failed.length]);



  message.style.background=failed.length?'#fff3e0':'#e8f5e9';



  message.style.color=failed.length?'#a45b00':'#2e7d32';



}
