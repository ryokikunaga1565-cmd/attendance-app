<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>出勤簿</title>
  <link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="出勤簿">

  <style>
    body {
      font-family: sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 12px;
    }

    .container {
      max-width: 450px;
      margin: 15px auto;
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.1);
    }

   h1 {
  text-align: center;
  font-size: 24px;
  margin-top: 5px;
  margin-bottom: 20px;
}

    label {
      display: block;
      margin-top: 14px;
      margin-bottom: 7px;
      font-weight: bold;
    }

   select, input {
  width: 100%;
  padding: 14px;
  font-size: 17px;
  box-sizing: border-box;
  border: 1px solid #ccc;
  border-radius: 8px;
  background: white;
}

   button {
  width: 100%;
  padding: 18px;
  margin-top: 22px;
  font-size: 20px;
  font-weight: bold;
  cursor: pointer;
  border: none;
  border-radius: 10px;
  background: #1976d2;
  color: white;
}

    #message {
  text-align: center;
  margin-top: 20px;
  padding: 12px;
  font-weight: bold;
  font-size: 16px;
  border-radius: 8px;
  min-height: 20px;
}
  </style>
 
</head>

<body>

  <div class="container">

    <h1>出勤簿</h1>

    <label>登録者</label>

<div id="employeeDisplay" style="display:none;">
  <div
    id="employeeName"
    style="padding:10px 14px;font-size:19px;font-weight:bold;background:#f5f5f5;border-radius:8px;"
  ></div>
</div>

<select id="employee">
  <option value="">読み込み中...</option>
</select>

  <label>勤務区分</label>
    <select id="workType">
      <option>通常勤務</option>
      <option>夜勤</option>
      <option>休日出勤</option>
    </select>
   
   <label>現場名</label>
<select id="site">
  <option value="">読み込み中...</option>
</select>
    <button onclick="checkIn()">出勤する</button>

<button
  type="button"
  id="lateButton"
  onclick="showLateForm()"
  style="margin-top:18px;padding:12px;font-size:15px;background:white;color:#555;border:1px solid #bbb;"
>
  前日までの出勤入力
</button>

<div id="lateForm" style="display:none;">

  <label>出勤日</label>
  <input type="date" id="workDate">

  <button
  type="button"
  id="lateSubmitButton"
  onclick="submitLateCheckIn()"
  style="margin-top:20px;"
>
  後日申請する
</button>

</div>

<div id="message"></div>
<div
  onclick="changeEmployee()"
  style="margin-top:20px;text-align:center;font-size:11px;color:#bbb;cursor:pointer;"
>
  社員設定
</div>

  </div>

 <script>
  const employeeSelect = document.getElementById("employee");
  const workTypeSelect = document.getElementById("workType");
  const siteSelect = document.getElementById("site");

  // この端末に保存されている前回の選択内容を読み込む
  const savedEmployee = localStorage.getItem("employeeName");
  const savedWorkType = localStorage.getItem("workType");
  const savedSite = localStorage.getItem("site");
  const webAppUrl = "https://script.google.com/macros/s/AKfycbxjvNYi0z_OMa-qCXwCydP1e9H86LtC9hTW-Qnpp4yfTr6FyFao3CBL1nEnngwr5TPS/exec";

async function loadMasterData() {
  try {
    const response = await fetch(webAppUrl);
    const data = await response.json();

    // 社員一覧
    employeeSelect.innerHTML =
      '<option value="">選択してください</option>';

    data.employees.forEach(function(employee) {
      const option = document.createElement("option");
      option.value = employee;
      option.textContent = employee;
      employeeSelect.appendChild(option);
    });

    // 現場一覧
    siteSelect.innerHTML =
      '<option value="">選択してください</option>';

    data.sites.forEach(function(site) {
      const option = document.createElement("option");
      option.value = site;
      option.textContent = site;
      siteSelect.appendChild(option);
    });

    // 前回選択した社員・現場を復元
    const savedEmployee = localStorage.getItem("employeeName");
    const savedSite = localStorage.getItem("site");

    if (savedEmployee) {
  employeeSelect.value = savedEmployee;

  document.getElementById("employeeName").textContent = savedEmployee;
  document.getElementById("employeeDisplay").style.display = "block";
  employeeSelect.style.display = "none";
}

if (savedSite) {
  siteSelect.value = savedSite;
}

  } catch (error) {
    employeeSelect.innerHTML =
      '<option value="">社員一覧を取得できませんでした</option>';

    siteSelect.innerHTML =
      '<option value="">現場一覧を取得できませんでした</option>';

    console.error(error);
  }
}

loadMasterData();
// 10秒ごとに最新の社員・現場マスターを取得
setInterval(function () {
  loadMasterData();
}, 10000);

  // 前回の内容を画面に反映
  
  

  if (savedWorkType) {
    workTypeSelect.value = savedWorkType;
  }

  if (savedSite) {
    siteSelect.value = savedSite;
  }

  // 社員名を変更したら保存
  employeeSelect.addEventListener("change", function () {
  const employee = employeeSelect.value;

  if (!employee) return;

  localStorage.setItem("employeeName", employee);

  document.getElementById("employeeName").textContent = employee;
  document.getElementById("employeeDisplay").style.display = "block";
  employeeSelect.style.display = "none";
});

  // 勤務区分を変更したら保存
  workTypeSelect.addEventListener("change", function () {
    localStorage.setItem("workType", workTypeSelect.value);
  });

  // 現場名を変更したら保存
  siteSelect.addEventListener("change", function () {
    localStorage.setItem("site", siteSelect.value);
  });

  async function checkIn() {
  const employee = employeeSelect.value;
  const workType = workTypeSelect.value;
  const site = siteSelect.value;

  if (!employee) {
    alert("社員名を選択してください");
    return;
  }

  if (!site) {
    alert("現場名を選択してください");
    return;
  }

  // 前回の選択内容を保存
  localStorage.setItem("employeeName", employee);
  localStorage.setItem("workType", workType);
  localStorage.setItem("site", site);

  const url = "https://script.google.com/macros/s/AKfycbxjvNYi0z_OMa-qCXwCydP1e9H86LtC9hTW-Qnpp4yfTr6FyFao3CBL1nEnngwr5TPS/exec";

  const button = document.querySelector("button");
  const message = document.getElementById("message");

  button.disabled = true;
  button.textContent = "送信中...";
  message.textContent = "";
  message.style.background = "transparent";
message.style.color = "";

  try {
    const response = await fetch(url, {
      method: "POST",
      body: JSON.stringify({
        employee: employee,
        workType: workType,
        site: site
      })
    });

    const result = await response.json();

    if (result.result === "duplicate") {
      message.textContent =
        "⚠ 本日はすでに「" + workType + "」で出勤登録されています";
        message.style.background = "#ffebee";
message.style.color = "#c62828";
      return;
    }

    if (result.result === "success") {
      const now = new Date();
      const time = now.toLocaleTimeString("ja-JP");

      message.textContent =
        "✓ " + employee + "　出勤しました　" + time;
        message.style.background = "#e8f5e9";
message.style.color = "#2e7d32";
    } else {
      throw new Error("登録結果が不明です");
    }

  } catch (error) {
    message.textContent = "⚠ 出勤記録を送信できませんでした";
    message.style.background = "#ffebee";
message.style.color = "#c62828";
    console.error(error);

  } finally {
    button.disabled = false;
    button.textContent = "出勤する";
  }
}
function showLateForm() {
  const lateForm = document.getElementById("lateForm");
  const workDate = document.getElementById("workDate");

  // 今日の日付
  const today = new Date();
  const yyyy = today.getFullYear();
  const mm = String(today.getMonth() + 1).padStart(2, "0");
  const dd = String(today.getDate()).padStart(2, "0");

  // 昨日の日付を作る
const yesterday = new Date(today);
yesterday.setDate(today.getDate() - 1);

const yyyyy = yesterday.getFullYear();
const ymm = String(yesterday.getMonth() + 1).padStart(2, "0");
const ydd = String(yesterday.getDate()).padStart(2, "0");
const yesterdayString = `${yyyyy}-${ymm}-${ydd}`;

// 「前日まで」なので今日の日付は選べない
workDate.max = yesterdayString;

// 初回は昨日を表示
if (!workDate.value) {
  workDate.value = yesterdayString;
}

  lateForm.style.display =
    lateForm.style.display === "none" ? "block" : "none";
}
async function submitLateCheckIn() {
  const employee = employeeSelect.value;
  const workType = workTypeSelect.value;
  const site = siteSelect.value;
  const workDate = document.getElementById("workDate").value;
  const message = document.getElementById("message");
  const lateSubmitButton = document.getElementById("lateSubmitButton");
  message.textContent = "";
message.style.background = "transparent";
message.style.color = "";

  if (!employee) {
    alert("社員名を選択してください");
    return;
  }

  if (!site) {
    alert("現場名を選択してください");
    return;
  }

  if (!workDate) {
    alert("出勤日を選択してください");
    return;
  }
const today = new Date();
today.setHours(0, 0, 0, 0);

const selectedDate = new Date(workDate + "T00:00:00");

if (selectedDate >= today) {
  alert("前日までの日付を選択してください");
  return;
}
lateSubmitButton.disabled = true;
lateSubmitButton.textContent = "送信中...";

// 「送信中...」を画面に描画させる
await new Promise(resolve => setTimeout(resolve, 500));

try {
    const response = await fetch(webAppUrl, {
      method: "POST",
      body: JSON.stringify({
        employee: employee,
        workType: workType,
        site: site,
        workDate: workDate,
        action: "lateCheckIn"
      })
    });

    const result = await response.json();

    if (result.result === "duplicate") {
      message.textContent = "⚠ この日はすでに同じ勤務区分で登録されています";
      message.style.background = "#ffebee";
message.style.color = "#c62828";
      return;
    }

    if (result.result === "success") {
      message.textContent = "✓ 後日申請しました";
      message.style.background = "#e8f5e9";
message.style.color = "#2e7d32";
    } else {
      throw new Error("登録結果が不明です");
    }

  } catch (error) {
  message.textContent = "⚠ 後日申請を送信できませんでした";
  message.style.background = "#ffebee";
  message.style.color = "#c62828";
  console.error(error);

} finally {
  lateSubmitButton.disabled = false;
  lateSubmitButton.textContent = "後日申請する";
}
}
function changeEmployee() {
  const password = prompt("社員設定パスワードを入力してください");

  if (password === null) {
    return;
  }

  if (password !== "1234") {
    alert("パスワードが違います");
    return;
  }

  const currentEmployee = localStorage.getItem("employeeName");

  document.getElementById("employeeDisplay").style.display = "none";
  employeeSelect.style.display = "block";
  employeeSelect.value = currentEmployee || "";
}
</script>

</body>
</html>
